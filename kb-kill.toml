# kb-kill configuration (TOML) — shipped default
#
# This default is INTENTIONALLY EMPTY: it defines no group, so out of the box
# kb-kill does NOTHING — it only monitors and can never disable a keyboard.
# There is no built-in hotkey; a keyboard can be killed ONLY by a combo you set
# here yourself. Until you uncomment and edit a group below, nothing happens.
#
# This file is picked up automatically: the kb-kill-push service in your session
# reads it and hands it to the root daemon, which follows whichever user is
# currently in control of the seat. There is nothing to point the daemon at — it
# just uses the active user's config. Edits are re-pushed and applied live.
#
# ─── How to enable it ─────────────────────────────────────────────────────────
# 1. Find your device's name:     sudo kb-kill-daemon detect
# 2. Uncomment the default group below and set `keyboards` (or `pointers` /
#    `devices`) to that name.
# 3. Keep (or change) the kill/wake combos — both are REQUIRED; there is no
#    hidden default. Save; it applies live.
#
# ─── Groups ──────────────────────────────────────────────────────────────────
# Each "group" is a set of target devices with its own kill/wake hotkeys:
#
#   * Top-level keys (uncommented, below) form the DEFAULT group, if they include
#     a matcher field. Their kill_combo/wake_combo also act as DEFAULTS inherited
#     by every [groups.*] table (`virtual` is per-group, never inherited).
#   * Each [groups.<name>] table adds another group, inheriting kill_combo /
#     wake_combo it doesn't set. `virtual` defaults to "auto" per group.
#   * A group is matched by up to three name fields (case-insensitive; each a
#     string or list of strings). An entry is matched against the WHOLE device
#     name: EXACTLY if it has no wildcard, otherwise as a bash-style glob
#     (* ? [seq] [!seq] {a,b}) — so "Logitech USB Keyboard" matches only that
#     device, "*razer*" is the substring match, "logitech mx*" globs, and a bare
#     "*" matches every device of that class.
#     At least ONE is required — set several to target them together:
#       keyboards = ...   → keyboard-class devices only
#       pointers  = ...   → pointing devices only (mice, trackballs, touchpads)
#       devices   = ...   → ANY input device, regardless of class
#   * Optional per group: label = "Laptop keyboard" — a display name the tray
#     shows instead of the group's table key. Cosmetic only.
#   * TOML rule: top-level keys MUST come before any [groups.*] table.
#   * Give each group a DISTINCT combo (a shared combo just toggles both groups
#     together — which is how you kill a physical + a virtual target at once).
#
# Hotkey tokens are joined by '+'. Modifier aliases match either side: ctrl, alt,
# shift, super/meta/win. Pin a side with l/r: lctrl, rctrl, lalt, ralt, ...
# Mouse buttons: mouseleft / mouseright / mousemiddle (or a raw BTN_* name) — use
# these so a killed pointer can self-wake. Other tokens: a letter a-z, a raw
# KEY_* name, or a numeric keycode.
# ─────────────────────────────────────────────────────────────────────────────

# ─── Default group (uncomment + edit to enable) ───────────────────────────────
# keyboards  = "AT Translated Set 2 keyboard"   # exact name (see `detect`)
# kill_combo = "ctrl+alt+shift+k"               # required — no default
# wake_combo = "ctrl+alt+shift+w"               # required — no default
#
# `virtual` says what to do about a remapper that "fronts" a device (grabs it and
# re-emits its events through a virtual "forwarded" copy):
#   "auto"  the DEFAULT — leave it out. Per device: kb-kill targets the forwarded
#           copy if input-remapper fronts this device, else the device itself. So
#           the name above keeps working whether input-remapper runs or not.
#   true    virtual devices ONLY — never a physical one, so a group that must
#           never touch hardware grabs nothing while the remapper is stopped.
#   false   literal: grab exactly what the matcher named. The escape hatch for a
#           remapper kb-kill can't detect (kanata/keyd/evremap mark nothing), and
#           the only value that can fight input-remapper for a grab.
# virtual = "auto"

# ─── A pointer group (optional) ───────────────────────────────────────────────
# Disable mice/touchpads; wake with a mouse-button combo so the pointer can wake
# itself (or use a keyboard combo and wake it from the keyboard).
#
# [groups.pointer]
# label      = "Mouse & touchpad"     # optional: shown in the tray
# pointers   = "*"                    # all mice/trackballs/touchpads
# kill_combo = "ctrl+alt+shift+m"
# wake_combo = "mouseleft+mouseright"

# ─── A mixed group (optional) ─────────────────────────────────────────────────
# One hotkey kills a keyboard AND a mouse together.
#
# [groups.externals]
# keyboards  = ["KBDfans*", "some-other-keyboard"]   # glob / exact name
# pointers   = "Logitech*"
# kill_combo = "ctrl+alt+shift+j"
# wake_combo = "ctrl+alt+shift+n"
